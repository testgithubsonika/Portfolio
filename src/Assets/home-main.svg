<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Desk -->
  <rect x="60" y="310" width="380" height="16" rx="8" fill="#0f2d1f"/>
  <rect x="100" y="326" width="16" height="80" rx="8" fill="#0a1f14"/>
  <rect x="384" y="326" width="16" height="80" rx="8" fill="#0a1f14"/>

  <!-- Monitor stand -->
  <rect x="222" y="296" width="56" height="18" rx="4" fill="#0f2d1f"/>
  <rect x="200" y="308" width="100" height="8" rx="4" fill="#0a1f14"/>

  <!-- Monitor frame -->
  <rect x="120" y="140" width="260" height="162" rx="14" fill="#0c201a"/>
  <rect x="124" y="144" width="252" height="154" rx="10" fill="#071510"/>

  <!-- Monitor screen content -->
  <!-- Code lines -->
  <rect x="140" y="162" width="80" height="7" rx="3" fill="#00e5a0" opacity="0.9"/>
  <rect x="228" y="162" width="40" height="7" rx="3" fill="#4ade80" opacity="0.6"/>
  <rect x="148" y="178" width="60" height="6" rx="3" fill="#7aad96" opacity="0.5"/>
  <rect x="216" y="178" width="90" height="6" rx="3" fill="#00e5a0" opacity="0.4"/>
  <rect x="148" y="193" width="110" height="6" rx="3" fill="#7aad96" opacity="0.4"/>
  <rect x="140" y="208" width="50" height="6" rx="3" fill="#00e5a0" opacity="0.8"/>
  <rect x="198" y="208" width="70" height="6" rx="3" fill="#4ade80" opacity="0.5"/>
  <rect x="148" y="223" width="95" height="6" rx="3" fill="#7aad96" opacity="0.35"/>
  <rect x="140" y="238" width="130" height="6" rx="3" fill="#00e5a0" opacity="0.6"/>
  <rect x="148" y="253" width="70" height="6" rx="3" fill="#4ade80" opacity="0.45"/>
  <rect x="226" y="253" width="50" height="6" rx="3" fill="#7aad96" opacity="0.35"/>
  <rect x="140" y="268" width="45" height="6" rx="3" fill="#00e5a0" opacity="0.9"/>
  <!-- Blinking cursor -->
  <rect x="193" y="268" width="8" height="6" rx="1" fill="#00e5a0" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Monitor glow -->
  <rect x="124" y="144" width="252" height="154" rx="10" fill="url(#screenGlow)" opacity="0.15"/>

  <!-- Laptop body (smaller, on desk) -->
  <rect x="155" y="300" width="190" height="12" rx="4" fill="#0c201a"/>

  <!-- Keyboard (on desk in front) -->
  <rect x="170" y="316" width="160" height="4" rx="2" fill="#0f2d1f" opacity="0.6"/>

  <!-- ── Female figure ── -->

  <!-- Body / torso - dark hoodie -->
  <path d="M210 390 Q220 340 250 330 Q280 340 290 390 Z" fill="#1a3d2b"/>
  <!-- Hoodie detail -->
  <path d="M245 332 L250 380 L255 332" stroke="#00e5a0" stroke-width="1.5" opacity="0.3"/>

  <!-- Arms -->
  <!-- Left arm resting toward keyboard -->
  <path d="M215 360 Q195 375 185 390 Q182 395 188 397 Q195 398 200 390 Q210 378 220 365" fill="#c8845a"/>
  <!-- Right arm -->
  <path d="M285 360 Q305 375 315 390 Q318 395 312 397 Q305 398 300 390 Q290 378 280 365" fill="#c8845a"/>

  <!-- Hands -->
  <ellipse cx="186" cy="396" rx="10" ry="7" fill="#c8845a"/>
  <ellipse cx="314" cy="396" rx="10" ry="7" fill="#c8845a"/>

  <!-- Neck -->
  <rect x="243" y="308" width="14" height="26" rx="7" fill="#c8845a"/>

  <!-- Head -->
  <ellipse cx="250" cy="286" rx="38" ry="40" fill="#c8845a"/>

  <!-- Hair - long dark hair, female -->
  <!-- Main hair top -->
  <path d="M215 268 Q218 240 250 238 Q282 240 285 268 Q288 256 280 245 Q265 232 250 230 Q235 232 220 245 Q212 256 215 268Z" fill="#1a0a00"/>
  <!-- Left side hair flowing down -->
  <path d="M212 270 Q205 290 208 320 Q210 340 215 360 Q220 355 218 330 Q216 300 218 278Z" fill="#1a0a00"/>
  <!-- Right side hair flowing down -->
  <path d="M288 270 Q295 290 292 320 Q290 340 285 360 Q280 355 282 330 Q284 300 282 278Z" fill="#1a0a00"/>
  <!-- Hair highlight -->
  <path d="M238 242 Q250 238 262 242 Q255 244 250 244 Q245 244 238 242Z" fill="#2d1200" opacity="0.5"/>

  <!-- Face features -->
  <!-- Eyes -->
  <ellipse cx="236" cy="282" rx="5" ry="5.5" fill="#1a0a00"/>
  <ellipse cx="264" cy="282" rx="5" ry="5.5" fill="#1a0a00"/>
  <!-- Eye shine -->
  <circle cx="238" cy="280" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="266" cy="280" r="1.5" fill="white" opacity="0.8"/>
  <!-- Eyebrows -->
  <path d="M229 272 Q236 269 243 271" stroke="#1a0a00" stroke-width="2" stroke-linecap="round"/>
  <path d="M257 271 Q264 269 271 272" stroke="#1a0a00" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M248 288 Q250 294 252 288" stroke="#a0684a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M238 300 Q250 308 262 300" stroke="#a0684a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheek blush -->
  <ellipse cx="228" cy="297" rx="7" ry="4" fill="#e07070" opacity="0.25"/>
  <ellipse cx="272" cy="297" rx="7" ry="4" fill="#e07070" opacity="0.25"/>

  <!-- Earrings - small green studs -->
  <circle cx="212" cy="290" r="3.5" fill="#00e5a0"/>
  <circle cx="288" cy="290" r="3.5" fill="#00e5a0"/>

  <!-- Chair back -->
  <rect x="195" y="370" width="110" height="18" rx="9" fill="#071510"/>
  <rect x="208" y="386" width="84" height="60" rx="8" fill="#071510"/>

  <!-- Floating elements - code snippets around figure -->
  <!-- Left float -->
  <g opacity="0.7">
    <rect x="30" y="200" width="90" height="52" rx="8" fill="#0c201a" stroke="#00e5a0" stroke-width="1" opacity="0.6"/>
    <rect x="40" y="214" width="50" height="5" rx="2" fill="#00e5a0" opacity="0.8"/>
    <rect x="40" y="226" width="70" height="5" rx="2" fill="#4ade80" opacity="0.5"/>
    <rect x="40" y="238" width="40" height="5" rx="2" fill="#7aad96" opacity="0.5"/>
    <text x="40" y="212" font-family="monospace" font-size="9" fill="#00e5a0" opacity="0.6">const dev = () =&gt;</text>
  </g>

  <!-- Right float -->
  <g opacity="0.65">
    <rect x="380" y="180" width="100" height="60" rx="8" fill="#0c201a" stroke="#00e5a0" stroke-width="1" opacity="0.5"/>
    <text x="390" y="200" font-family="monospace" font-size="8" fill="#00e5a0" opacity="0.7">FastAPI ✓</text>
    <text x="390" y="214" font-family="monospace" font-size="8" fill="#4ade80" opacity="0.6">React.js ✓</text>
    <text x="390" y="228" font-family="monospace" font-size="8" fill="#7aad96" opacity="0.55">PyTorch ✓</text>
  </g>

  <!-- Top float badge -->
  <g opacity="0.6">
    <rect x="340" y="80" width="120" height="34" rx="17" fill="#00e5a0" opacity="0.12" stroke="#00e5a0" stroke-width="1"/>
    <text x="360" y="100" font-family="monospace" font-size="11" fill="#00e5a0">CF Specialist 🏆</text>
  </g>

  <!-- Glow under figure -->
  <ellipse cx="250" cy="418" rx="100" ry="12" fill="#00e5a0" opacity="0.06"/>

  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
